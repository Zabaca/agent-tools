name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/{{DB_NAME_BASE}}
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: ${{ '{{PKG_MGR}}' == 'pnpm' }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: '{{PKG_MGR}}'

      - name: Install dependencies
        run: {{PKG_MGR}} {{INSTALL_FROZEN}}

      - name: Install Playwright browsers
        run: {{PKG_MGR}} exec playwright install --with-deps chromium

      - name: Run e2e
        run: {{PKG_MGR}} test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
